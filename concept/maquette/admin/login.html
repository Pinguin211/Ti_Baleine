<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ti'Baleine Admin — Connexion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .playfair { font-family: 'Playfair Display', serif; }
    .ocean-bg { background: linear-gradient(135deg, #020c1b 0%, #0a1a3a 50%, #0d2750 100%); }
    input:focus { outline: none; border-color: #00B4D8; box-shadow: 0 0 0 3px rgba(0,180,216,0.12); }
    .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
    @keyframes float {
      0%,100% { transform: translateY(0px) rotate(0deg); }
      50%  { transform: translateY(-20px) rotate(5deg); }
    }
    .float { animation: float 6s ease-in-out infinite; }
    .float-delay { animation: float 8s ease-in-out infinite 2s; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.6s ease both; }
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; }
  </style>
</head>
<body class="ocean-bg min-h-screen flex items-center justify-center px-4 relative overflow-hidden">

  <!-- Decorative blobs -->
  <div class="absolute top-[-100px] right-[-100px] w-96 h-96 bg-blue-600 rounded-full opacity-10 blur-3xl float"></div>
  <div class="absolute bottom-[-50px] left-[-80px] w-80 h-80 bg-cyan-500 rounded-full opacity-10 blur-3xl float-delay"></div>

  <!-- Back link -->
  <a href="../index.html" class="absolute top-6 left-6 flex items-center gap-2 text-white/40 hover:text-white/80 text-sm transition-colors">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    Retour aux maquettes
  </a>

  <div class="w-full max-w-sm relative z-10">

    <!-- Logo & Title -->
    <div class="text-center mb-10 fade-up">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-cyan-500 to-blue-700 rounded-2xl shadow-2xl shadow-cyan-500/30 mb-5 text-3xl">⚓</div>
      <h1 class="playfair text-3xl font-black text-white mb-1">Administration</h1>
      <p class="text-white/40 text-sm">Ti'Baleine · Espace de gestion interne</p>
    </div>

    <!-- Card -->
    <div class="glass rounded-3xl p-8 fade-up delay-1">
      <h2 class="text-white font-semibold text-lg mb-6">Connexion</h2>

      <div class="space-y-5">

        <div>
          <label class="block text-white/50 text-xs font-semibold tracking-widest uppercase mb-2">Identifiant</label>
          <div class="relative">
            <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-white/30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            <input type="text" id="login-user" placeholder="admin" class="w-full bg-white/5 border border-white/10 text-white placeholder-white/25 rounded-xl pl-11 pr-4 py-3.5 text-sm transition-all" value="admin" />
          </div>
        </div>

        <div>
          <label class="block text-white/50 text-xs font-semibold tracking-widest uppercase mb-2">Mot de passe</label>
          <div class="relative">
            <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-white/30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            <input type="password" id="login-pass" placeholder="••••••••" class="w-full bg-white/5 border border-white/10 text-white placeholder-white/25 rounded-xl pl-11 pr-12 py-3.5 text-sm transition-all" value="••••••••" />
            <button onclick="togglePass()" class="absolute right-4 top-1/2 -translate-y-1/2 text-white/30 hover:text-white/60 transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>

        <div id="login-error" class="hidden flex items-center gap-2 bg-red-500/10 border border-red-500/20 rounded-xl px-4 py-3">
          <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
          <span class="text-red-400 text-sm">Identifiants incorrects.</span>
        </div>

        <button onclick="doLogin()" class="w-full bg-gradient-to-r from-cyan-500 to-blue-700 hover:from-cyan-400 hover:to-blue-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-cyan-500/20 transition-all hover:scale-[1.02] flex items-center justify-center gap-2 mt-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>
          Se connecter
        </button>
      </div>
    </div>

    <!-- Footer note -->
    <p class="text-center text-white/20 text-xs mt-8 fade-up delay-3">
      Accès réservé — Ti'Baleine Administration
    </p>
  </div>

  <script>
    function doLogin() {
      const u = document.getElementById('login-user').value;
      const p = document.getElementById('login-pass').value;
      if (u === 'admin' && p.length > 0) {
        window.location.href = 'dashboard.html';
      } else {
        document.getElementById('login-error').classList.remove('hidden');
      }
    }

    function togglePass() {
      const inp = document.getElementById('login-pass');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
