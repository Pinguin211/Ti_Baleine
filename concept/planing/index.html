<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planning 2 Semaines - Ti'Baleine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header principal -->
    <header class="app-header">
      <div class="header-left">
        <div class="logo-badge">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>
            <path d="m9 16 2 2 4-4"/>
          </svg>
          <span>SprintPlanner</span>
        </div>
        <div class="title-group">
          <h1>Planning 2 Semaines</h1>
          <p id="dateRangeSubtitle" class="subtitle">Chargement du planning...</p>
        </div>
      </div>

      <div class="header-center">
        <!-- Navigation des semaines -->
        <div class="week-nav-group">
          <button id="prevWeekBtn" class="btn btn-icon" title="Reculer d'une semaine">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <button id="todayBtn" class="btn btn-secondary btn-sm" title="Revenir à la semaine actuelle">
            Aujourd'hui
          </button>
          <button id="nextWeekBtn" class="btn btn-icon" title="Avancer d'une semaine">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>

        <!-- Toggle 5j / 7j -->
        <div class="view-toggle">
          <button id="toggle5Days" class="toggle-btn active">5 Jours</button>
          <button id="toggle7Days" class="toggle-btn">7 Jours</button>
        </div>
      </div>

      <div class="header-right">
        <!-- Bouton Télécharger data.js à jour -->
        <button id="downloadDataJsBtn" class="btn btn-save-local" title="Télécharger le fichier data.js à jour pour remplacer celui du dossier">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span>Télécharger data.js</span>
        </button>

        <button id="addPersonaBtn" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
          <span>Nouveau Persona</span>
        </button>

        <div class="dropdown">
          <button id="menuOptionsBtn" class="btn btn-icon btn-outline" title="Options et données">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
          </button>
          <div id="optionsDropdownMenu" class="dropdown-menu">
            <button id="reloadInitialDataBtn" class="dropdown-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
              Recharger depuis data.js
            </button>
            <label class="dropdown-item file-label">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              Importer un fichier data.js
              <input type="file" id="importDataJsInput" accept=".js" style="display: none;">
            </label>
            <div class="dropdown-divider"></div>
            <button id="printBtn" class="dropdown-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
              Imprimer / Synthèse PDF
            </button>
            <button id="clearAllBtn" class="dropdown-item text-danger">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              Effacer le planning
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Barre d'outils secondaire : Statistiques & Filtres -->
    <div class="stats-bar">
      <div class="stats-left">
        <div class="stat-badge">
          <span class="stat-label">Personas :</span>
          <span id="statPersonaCount" class="stat-value">0</span>
        </div>
        <div class="stat-badge">
          <span class="stat-label">Tâches totales :</span>
          <span id="statTotalTasks" class="stat-value">0</span>
        </div>
        <div class="stat-badge stat-progress-badge">
          <span class="stat-label">Avancement :</span>
          <div class="mini-progress-bar">
            <div id="statProgressBar" class="mini-progress-fill" style="width: 0%;"></div>
          </div>
          <span id="statPercent" class="stat-value">0%</span>
        </div>
      </div>

      <div class="stats-right">
        <div class="search-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="searchInput" placeholder="Filtrer une tâche ou un persona...">
        </div>
      </div>
    </div>

    <!-- Conteneur principal du planning (Grille sur 2 semaines) -->
    <main class="planning-main">
      <div class="planning-table-wrapper" id="planningWrapper">
        <table class="planning-table" id="planningTable">
          <thead>
            <!-- Ligne 1 : Regroupement Semaine 1 & Semaine 2 -->
            <tr class="week-header-row" id="weekGroupRow"></tr>
            <!-- Ligne 2 : Jours individuels (Lun, Mar, ...) -->
            <tr class="days-header-row" id="daysHeaderRow"></tr>
          </thead>
          <tbody id="planningBody">
            <!-- Rendu dynamique des lignes pour chaque persona -->
          </tbody>
        </table>
      </div>

      <!-- Message si aucun persona -->
      <div id="emptyState" class="empty-state" style="display: none;">
        <div class="empty-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        <h3>Aucun persona configuré</h3>
        <p>Ajoutez votre premier persona pour commencer à planifier vos tâches quotidiennes sur 2 semaines.</p>
        <div class="empty-actions">
          <button class="btn btn-primary" onclick="openPersonaModal()">+ Ajouter un Persona</button>
          <button class="btn btn-secondary" onclick="loadSampleData()">Charger l'équipe Ti'Baleine</button>
        </div>
      </div>
    </main>
  </div>

  <!-- MODAL : Persona (Ajouter / Modifier) -->
  <div id="personaModal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="personaModalTitle">Nouveau Persona</h3>
        <button class="modal-close" onclick="closePersonaModal()">&times;</button>
      </div>
      <form id="personaForm">
        <input type="hidden" id="personaId">
        <div class="form-group">
          <label for="personaName">Nom du Persona *</label>
          <input type="text" id="personaName" placeholder="Ex: Benjamin, Thomas, Ivan..." required autofocus>
        </div>
        <div class="form-group">
          <label for="personaRole">Rôle / Spécialité</label>
          <input type="text" id="personaRole" placeholder="Ex: Développeur Fullstack, UI Designer...">
        </div>
        <div class="form-group">
          <label>Couleur d'identification</label>
          <div class="color-picker-palette" id="colorPalette">
            <!-- Généré par JS -->
          </div>
          <input type="hidden" id="personaColor" value="#3b82f6">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closePersonaModal()">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL : Tâche (Ajouter / Modifier) -->
  <div id="taskModal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <h3 id="taskModalTitle">Tâche du jour</h3>
          <p id="taskModalSubtitle" class="modal-subtitle">Persona • Date</p>
        </div>
        <button class="modal-close" onclick="closeTaskModal()">&times;</button>
      </div>
      <form id="taskForm">
        <input type="hidden" id="taskPersonaId">
        <input type="hidden" id="taskDate">
        
        <div class="form-group">
          <label for="taskTitle">Description de la tâche *</label>
          <textarea id="taskTitle" rows="3" placeholder="Ex: Intégration du composant calendrier, Tests paiement Stripe..." required></textarea>
        </div>

        <div class="form-group">
          <label>Statut de la tâche</label>
          <div class="status-selector" id="statusSelector">
            <label class="status-option">
              <input type="radio" name="taskStatus" value="todo" checked>
              <span class="status-pill status-todo">À faire</span>
            </label>
            <label class="status-option">
              <input type="radio" name="taskStatus" value="in_progress">
              <span class="status-pill status-in_progress">En cours</span>
            </label>
            <label class="status-option">
              <input type="radio" name="taskStatus" value="done">
              <span class="status-pill status-done">Terminé</span>
            </label>
            <label class="status-option">
              <input type="radio" name="taskStatus" value="blocked">
              <span class="status-pill status-blocked">Bloqué</span>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="taskNotes">Notes / Liens (optionnel)</label>
          <input type="text" id="taskNotes" placeholder="Ex: PR #12, Dépendance avec l'API Stripe">
        </div>

        <div class="modal-footer split">
          <button type="button" id="deleteTaskBtn" class="btn btn-danger-outline" style="display: none;" onclick="deleteCurrentTask()">
            Supprimer
          </button>
          <div class="modal-actions-right">
            <button type="button" class="btn btn-secondary" onclick="closeTaskModal()">Annuler</button>
            <button type="submit" class="btn btn-primary">Enregistrer</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast de notification -->
  <div id="toast" class="toast"></div>

  <!-- Données locales -->
  <script src="data.js"></script>
  <!-- Application -->
  <script src="app.js"></script>
</body>
</html>
