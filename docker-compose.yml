version: '3.8'

services:
  app:
    # Utilisation d'une image basée sur Debian (Bookworm) avec glibc et bash natifs
    image: node:24-bookworm
    container_name: nextjs_sandbox
    working_dir: /app
    ports:
      - "3000:3000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      # Synchronisation du dossier racine
      - .:/app
      # Volume anonyme recommandé pour isoler les dépendances compilées du conteneur
      - /app/node_modules
    # Maintient le conteneur actif sans rien exécuter au démarrage
    command: tail -f /dev/null
    stdin_open: true
    tty: true
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/ti_baleine
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ti_baleine
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ti_baleine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ti_baleine"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: